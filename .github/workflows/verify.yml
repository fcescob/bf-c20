name: Verify
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: mathlib-cache
        with:
          path: .lake/packages
          key: lean428-mathlib-8f9d9cff-linux-cycle
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib dependencies
        run: lake exe cache get Mathlib.GroupTheory.Perm.Cycle.Concrete
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        with:
          path: .lake/packages
          key: lean428-mathlib-8f9d9cff-linux-cycle
      - name: Check Lean proof and audit axioms
        run: |
          set -o pipefail
          lake build
          lake env lean C20.lean | tee lean-axioms.log
          lake env lean C20Gaps.lean | tee -a lean-axioms.log
          lake env lean C20Boundary.lean | tee -a lean-axioms.log
          lake env lean C20Expansion.lean | tee -a lean-axioms.log
          lake env lean C20Cycles.lean | tee -a lean-axioms.log
          lake env lean C20Kernel.lean | tee -a lean-axioms.log
          lake env lean C20Even.lean | tee -a lean-axioms.log
          if grep -E 'sorryAx|ofReduceBool|native_decide' lean-axioms.log; then exit 1; fi
      - name: Build and probe the Lean boundary computation
        run: |
          lake build boundary-search
          .lake/build/bin/boundary-search 4 6 8
          lake env lean C20Finite.lean
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check package hashes
        run: sha256sum -c SHA256SUMS
      - name: Reproduce every finite case and physical checks
        run: ./verify.sh
      - name: Reproduce text-only distribution without banked certificate
        run: |
          mv partitions.bin.gz out/banked.bin.gz
          ./verify.sh
