name: Verify
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check Lean proof and audit axioms
        run: |
          set -o pipefail
          lake build
          lake env lean C20.lean | tee lean-axioms.log
          if grep -E 'sorryAx|ofReduceBool|native_decide' lean-axioms.log; then exit 1; fi
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check package hashes
        run: sha256sum -c SHA256SUMS
      - name: Reproduce every finite case and physical checks
        run: ./verify.sh
      - name: Reproduce text-only distribution without banked certificate
        run: |
          mv partitions.bin.gz out/banked.bin.gz
          ./verify.sh
  published-gist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve the published standalone gist
        run: |
          git clone https://gist.github.com/59ce2639b82277aad07b7f337403f628.git gist
          git -C gist checkout 33973d2f27611db9c320ac81edf38a61a8d84cec
      - name: Verify published files and regenerate the proof certificate
        working-directory: gist
        run: |
          sha256sum -c SHA256SUMS
          bash verify.sh
