name: Check the complete C20 theorem
on:
  workflow_dispatch:
    inputs:
      shard_run:
        description: Run containing all ten successful matching-head artifacts
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .lake/packages
          key: lean428-mathlib-8f9d9cff-linux-cycle
      - name: Verify unchanged finite proof sources
        env:
          GH_TOKEN: ${{ github.token }}
          C20_SHARD_RUN: ${{ inputs.shard_run }}
        run: |
          C20_SOURCE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${C20_SHARD_RUN}" --jq .head_sha)
          [[ "$C20_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin "$C20_SOURCE_SHA" --depth=1
          git diff --exit-code "$C20_SOURCE_SHA" HEAD -- \
            lean-toolchain C20.lean C20Gaps.lean C20Boundary.lean \
            BoundarySearch.lean C20BoundaryMatching.lean C20MatchingFinite/Head*.lean
      - name: Install elan and fetch pinned Mathlib
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" exe cache get Mathlib.GroupTheory.Perm.Cycle.Concrete Mathlib.Data.List.FinRange
      - name: Check the whole unbounded graph reduction
        run: |
          set -o pipefail
          lake build | tee graph-build.log
          lake build C20BoundaryMatching:shared
          lake env lean C20Assemble.lean | tee graph-axioms.log
          if grep -E 'sorryAx|ofReduceBool' graph-axioms.log; then exit 1; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.shard_run }}
          pattern: matching-head-*
          path: .lake/build/lib/lean/C20MatchingFinite
          merge-multiple: true
      - name: Combine all finite proofs and check C20
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/C20MatchingFinite.olean C20MatchingFinite.lean | tee finite-axioms.log
          lake env lean -o .lake/build/lib/lean/C20Theorem.olean C20Theorem.lean | tee full-axioms.log
          if grep 'sorryAx' finite-axioms.log full-axioms.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-proof-audit
          path: |
            graph-build.log
            graph-axioms.log
            finite-axioms.log
            full-axioms.log
