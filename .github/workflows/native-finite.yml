name: Experimental native finite proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the finite checker and kernel-only small case
        run: |
          lake build boundary-search
          lake env lean -o .lake/build/lib/lean/C20Finite.olean C20Finite.lean
      - name: Native finite proof with explicit compiler trust
        run: |
          set -o pipefail
          /usr/bin/time -v lake env lean C20NativeFinite.lean | tee native-axioms.log
          if grep 'sorryAx' native-axioms.log; then exit 1; fi
